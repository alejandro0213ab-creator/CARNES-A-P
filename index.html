<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARNES A&P</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="header">
  <h1>CARNES A&P</h1>

  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#productos">Productos</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <button id="cartBtn">🛒 <span id="cartCount">0</span></button>
</header>

<section id="inicio">
  <h2>Las mejores carnes</h2>
  <a href="#productos">Ver productos</a>
</section>

<section id="productos">

  <h2>Productos</h2>

  <div>

    <div>
      <img src="img/res.jpg">
      <h3>Carne de Res</h3>
      <p>$20.000</p>
      <button onclick="agregarAlCarrito('Res', 20000)">Agregar</button>
    </div>

    <div>
      <img src="img/cerdo.jpg">
      <h3>Carne de Cerdo</h3>
      <p>$18.000</p>
      <button onclick="agregarAlCarrito('Cerdo', 18000)">Agregar</button>
    </div>

    <div>
      <img src="img/pollo.jpg">
      <h3>Pollo</h3>
      <p>$15.000</p>
      <button onclick="agregarAlCarrito('Pollo', 15000)">Agregar</button>
    </div>

  </div>

</section>

<section id="contacto">
  <h2>Contacto</h2>
  <p>Medellín</p>
</section>

<script src="js/app.js"></script>

</body>
</html>
